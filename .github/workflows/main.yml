name: DevSecOps Pipeline

on:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          python3 -m pip install semgrep
          semgrep --config p/javascript --config p/owasp-top-ten --severity ERROR --error
  
  // Quét lỗ hổng bảo mật trong mã nguồn
  sca-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Quét lỗ hổng thư viện (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-fs-report.json'
          exit-code: '0' # Giai đoạn 2: Cho qua để lấy Baseline
          severity: 'CRITICAL,HIGH'

      - name: Build Docker image
        run: docker build -t app-devsecops:${{ github.sha }} .

      - name: Quét lỗ hổng Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'app-devsecops:${{ github.sha }}'
          format: 'json'
          output: 'trivy-image-report.json'
          exit-code: '0' # Giai đoạn 2: Cho qua để lấy Baseline
          severity: 'CRITICAL,HIGH'

      - name: Kết xuất SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'cyclonedx-sbom.json'

      - name: Lưu trữ Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-sbom-reports
          path: |
            trivy-fs-report.json
            trivy-image-report.json
            cyclonedx-sbom.json