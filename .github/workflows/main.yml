name: DevSecOps Automated CI/CD Pipeline - UTH Group 10

# ==============================================================================
# SỰ KIỆN KÍCH HOẠT PIPELINE (TRIGGERS)
# Chạy tự động mỗi khi có Push lên main, nhánh tính năng, gắn tag, hoặc tạo PR
# ==============================================================================
on:
  push:
    branches: [ "main", "feat/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ============================================================================
  # CHẶNG 1: KIỂM THỬ ĐƠN VỊ (UNIT TEST - PHẦN NHẬT)
  # Mục đích: Đảm bảo chức năng logic cơ bản của Web App không bị hỏng
  # ============================================================================
  unit-test:
    name: 1. Unit Test (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Dùng npm ci thay vì npm install để đảm bảo đồng bộ 100% với package-lock.json
      - name: Install Dependencies
        run: npm ci

      - name: Execute Unit Tests
        run: npm test

  # ============================================================================
  # CHẶNG 2: SECRET SCANNING (PHẦN NHẬT - GITLEAKS)
  # Mục đích: Bắt lỗi SEC-01 (Lộ Google API Key cứng trong mã nguồn)
  # ============================================================================
  secret-scan:
    name: 2. Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Quét toàn bộ lịch sử commit để không bỏ sót secret

      - name: Run Gitleaks Scanner
        # Giai đoạn Baseline: Cho phép tiếp tục dù phát hiện lỗi để thu thập log
        continue-on-error: true
        run: |
          docker run --rm -v $(pwd):/path zricethezav/gitleaks:latest detect \
            --source="/path" \
            --report-path="/path/gitleaks-report.json" \
            --report-format="json" \
            --verbose

      # Xuất file báo cáo gitleaks-report.json lên tab Artifacts
      - name: Upload Gitleaks Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  # ============================================================================
  # CHẶNG 3: SAST SCANNING (PHẦN NHẬT - SEMGREP)
  # Mục đích: Bắt lỗi SEC-02 (SQL Injection CWE-89) và SEC-03 (Reflected XSS CWE-79)
  # ============================================================================
  sast:
    name: 3. SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep OSS
        # Giai đoạn Baseline: Cho phép tiếp tục dù phát hiện lỗi để lấy log JSON
        continue-on-error: true
        run: |
          docker run --rm -v $(pwd):/src returntocorp/semgrep semgrep scan \
            --config=p/default \
            --config=p/owasp-top-ten \
            --config=p/expressjs \
            --json \
            --output=/src/semgrep-report.json

      # Xuất file báo cáo semgrep-report.json lên tab Artifacts
      - name: Upload Semgrep Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: ignore

  # ============================================================================
  # CHẶNG 4: SCA SCANNING & SBOM (PHẦN THỊNH - TRIVY)
  # Mục đích: Quét SEC-04 và các dependency; Quality Gate chặn CRITICAL, tạo SBOM CycloneDX
  # ============================================================================
  sca-sbom:
    name: 4. SCA Scan & SBOM (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Docker Image
        run: docker build -t app-devsecops:${{ github.sha }} .

      - name: Generate CycloneDX SBOM
        run: |
          docker run --rm -v $(pwd):/src aquasec/trivy:latest fs \
            --format cyclonedx \
            --output /src/cyclonedx-sbom.json /src

      - name: Validate CycloneDX SBOM and checksum
        run: |
          docker run --rm -v "$(pwd):/src" cyclonedx/cyclonedx-cli:latest \
            cyclonedx validate --input-file /src/cyclonedx-sbom.json \
            --input-format json --input-version v1_7 --fail-on-errors
          sha256sum cyclonedx-sbom.json > cyclonedx-sbom.json.sha256
          sha256sum --check cyclonedx-sbom.json.sha256

      - name: Trivy Vulnerability Reports and Critical Quality Gates
        shell: bash
        run: |
          set +e
          mkdir -p trivy-reports

          all_start=$(date +%s.%N)
          fs_start=$(date +%s.%N)
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs \
            --scanners vuln \
            --skip-dirs node_modules \
            --exit-code 0 \
            --format json \
            --output /src/trivy-reports/trivy-fs-report.json /src
          fs_scan_exit=$?
          if [ "$fs_scan_exit" -eq 0 ]; then
            docker run --rm -v "$PWD:/src" aquasec/trivy:latest convert \
              --scanners vuln --format table --severity CRITICAL --exit-code 1 \
              /src/trivy-reports/trivy-fs-report.json
            fs_gate_exit=$?
          else
            fs_gate_exit=$fs_scan_exit
          fi
          fs_end=$(date +%s.%N)

          image_start=$(date +%s.%N)
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/src" aquasec/trivy:latest image \
            --scanners vuln \
            --exit-code 0 \
            --format json \
            --output /src/trivy-reports/trivy-image-report.json \
            "app-devsecops:${GITHUB_SHA}"
          image_scan_exit=$?
          if [ "$image_scan_exit" -eq 0 ]; then
            docker run --rm -v "$PWD:/src" aquasec/trivy:latest convert \
              --scanners vuln --format table --severity CRITICAL --exit-code 1 \
              /src/trivy-reports/trivy-image-report.json
            image_gate_exit=$?
          else
            image_gate_exit=$image_scan_exit
          fi
          image_end=$(date +%s.%N)
          all_end=$(date +%s.%N)

          python3 - "$fs_start" "$fs_end" "$image_start" "$image_end" \
            "$all_start" "$all_end" "$fs_gate_exit" "$image_gate_exit" <<'PY'
          import json
          import sys

          fs_start, fs_end, image_start, image_end, all_start, all_end = map(
              float, sys.argv[1:7]
          )
          fs_exit, image_exit = map(int, sys.argv[7:9])
          timing = {
              "trivy_fs_execution_time_sec": round(fs_end - fs_start, 3),
              "trivy_image_execution_time_sec": round(image_end - image_start, 3),
              "trivy_pipeline_total_sec": round(all_end - all_start, 3),
              "trivy_fs_gate_exit_code": fs_exit,
              "trivy_image_gate_exit_code": image_exit,
          }
          with open("trivy-reports/trivy-timing.json", "w", encoding="utf-8") as file:
              json.dump(timing, file, indent=2)
          PY

          if [ "$fs_gate_exit" -ne 0 ] || [ "$image_gate_exit" -ne 0 ]; then
            echo "Trivy Quality Gate FAILED: Critical finding or scan error."
            exit 1
          fi
          echo "Trivy Quality Gate PASSED: 0 Critical findings in filesystem and image."

      - name: Export Metrics CSV
        if: always()
        run: |
          python3 scripts/gen_csv.py \
            --fs-report trivy-reports/trivy-fs-report.json \
            --image-report trivy-reports/trivy-image-report.json \
            --timing trivy-reports/trivy-timing.json \
            --output trivy-reports/results_metrics.csv \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --repeat "${GITHUB_RUN_ATTEMPT}" \
            --scenario Patched \
            --commit "${GITHUB_SHA}"

      - name: Upload Trivy, SBOM, and Metrics Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sca-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cyclonedx-sbom.json
            cyclonedx-sbom.json.sha256
            trivy-reports/
          if-no-files-found: warn

  # ============================================================================
  # CHẶNG 5: DAST SCANNING (PHẦN QUYẾT - OWASP ZAP)
  # Mục đích: Bắt lỗi SEC-05 (Thiếu Security Headers: CSP và nosniff)
  # ============================================================================
  dast:
    name: 5. DAST Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 5.1. Build và chạy Web App ngầm trên runner để ZAP có mục tiêu quét
      - name: Build and Run Web Container
        run: |
          docker build -t target-app .
          docker run -d --name test-web -p 3000:3000 target-app
          sleep 5
          # Kiểm tra chắc chắn web đã khởi động thành công trước khi quét
          curl -I http://localhost:3000 || exit 1

      # 5.2. Chạy OWASP ZAP Baseline Scan (có file zap.conf loại bỏ cảnh báo rác)
      - name: Run OWASP ZAP Baseline Scan
        run: |
          mkdir -p zap-work
          chmod 777 zap-work

          # Tạo file zap.conf hóa giải 3 cảnh báo rác của trang 404
          cat << 'EOF' > zap-work/zap.conf
          10049	IGNORE	(Storable and Cacheable Content)
          10055	IGNORE	(CSP: Failure to Define Directive with No Fallback)
          10063	IGNORE	(Permissions Policy Header Not Set)
          EOF

          # Chạy ZAP nạp file cấu hình zap.conf
          docker run --rm --net="host" -v $(pwd)/zap-work:/zap/wrk/:rw \
            zaproxy/zap-stable zap-baseline.py \
            -t http://localhost:3000 \
            -c zap.conf \
            -J zap-report.json \
            -r zap-report.html

      # Xuất báo cáo HTML và JSON của ZAP lên tab Artifacts
      - name: Upload DAST Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-work/
          if-no-files-found: ignore

  # ============================================================================
  # CHẶNG 6: TỔNG KẾT & CHỐT CHẶN PHÁT HÀNH (DEPLOY GATE)
  # Điều kiện: Chờ cả 5 job trên hoàn thành để xác nhận trạng thái Baseline
  # ============================================================================
  deploy:
    name: 6. Quality Gate & Push to Registry
    needs: [unit-test, secret-scan, sast, sca-sbom, dast]
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Gates Passed
        run: |
          echo "======================================================================"
          echo "✅ QUALITY GATE PASSED: Toàn bộ 5 chốt chặn an ninh đều đạt chuẩn!"
          echo "🚀 Cấp quyền mở khóa triển khai (Deploy) sản phẩm lên GHCR!"
          echo "======================================================================"
