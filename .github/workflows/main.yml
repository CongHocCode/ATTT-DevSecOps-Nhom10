name: DevSecOps Automated CI/CD Pipeline - UTH Group 10

# ==============================================================================
# SỰ KIỆN KÍCH HOẠT PIPELINE (TRIGGERS)
# Chạy tự động mỗi khi có Push lên main, nhánh tính năng, nhánh thử nghiệm, gắn tag, hoặc tạo PR
# ==============================================================================
on:
  push:
    branches: ["main", "feat/*", "exp/*"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  # ============================================================================
  # CHẶNG 1: KIỂM THỬ ĐƠN VỊ (UNIT TEST - PHẦN NHẬT)
  # Mục đích: Đảm bảo chức năng logic cơ bản của Web App không bị hỏng
  # ============================================================================
  unit-test:
    name: 1. Unit Test (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Execute Unit Tests
        run: npm test

  # ============================================================================
  # CHẶNG 2: SECRET SCANNING (PHẦN NHẬT - GITLEAKS)
  # Mục đích: Bắt lỗi SEC-01 và kích hoạt Quality Gate (exit-code 1)
  # ============================================================================
  secret-scan:
    name: 2. Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Latest Commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Quét commit mới nhất, tránh dính lịch sử commit cũ

      - name: Run Gitleaks Scanner (Quality Gate Enabled)
        run: |
          docker run --rm -v $(pwd):/path zricethezav/gitleaks:latest detect \
            --source="/path" \
            --log-opts="-n 1" \
            --exit-code 1 \
            --redact \
            --report-path="/path/gitleaks-report.json" \
            --report-format="json" \
            --verbose

      - name: Upload Gitleaks Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  # ============================================================================
  # CHẶNG 3: SAST SCANNING (PHẦN NHẬT - SEMGREP)
  # Mục đích: Bắt lỗi SEC-02 (SQLi), SEC-03 (XSS) và kích hoạt Quality Gate (--error => exit-code 1)
  # ============================================================================
  sast:
    name: 3. SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep OSS (Quality Gate Enabled)
        run: |
          docker run --rm -v $(pwd):/src returntocorp/semgrep semgrep scan \
            --config=p/default \
            --config=p/owasp-top-ten \
            --config=p/expressjs \
            --error \
            --json \
            --output=/src/semgrep-report.json \
            /src/server.js

      - name: Upload Semgrep Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: ignore

  # ============================================================================
  # CHẶNG 4: SCA VÀ SBOM (PHẦN THỊNH - TRIVY)
  # ============================================================================
  sca-sbom:
    name: 4. SCA Scan & SBOM (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Docker Image
        run: docker build -t app-devsecops:${{ github.sha }} .

      - name: Create Shared Trivy Cache
        run: docker volume create trivy-cache

      - name: Generate CycloneDX SBOM
        run: |
          docker run --rm -v trivy-cache:/cache/trivy -v "$PWD:/src" aquasec/trivy:0.76.2 fs \
            --cache-dir /cache/trivy \
            --format cyclonedx \
            --output /src/cyclonedx-sbom.json /src

      - name: Validate CycloneDX SBOM and Checksum
        run: |
          docker run --rm -v "$PWD:/src" cyclonedx/cyclonedx-cli:latest \
            cyclonedx validate --input-file /src/cyclonedx-sbom.json \
            --input-format json --input-version v1_7 --fail-on-errors
          sha256sum cyclonedx-sbom.json > cyclonedx-sbom.json.sha256
          sha256sum --check cyclonedx-sbom.json.sha256

      - name: Trivy Reports and HIGH/CRITICAL Quality Gate (3 Repeats)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trivy-reports

          docker run --rm -v trivy-cache:/cache/trivy aquasec/trivy:0.76.2 image \
            --cache-dir /cache/trivy \
            --download-db-only
          db_warmed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          overall_failed=0

          for repeat_no in 1 2 3; do
            repeat_id=$(printf '%02d' "$repeat_no")
            if [ "$repeat_no" -gt 1 ]; then
              docker run --rm -v trivy-cache:/cache/trivy aquasec/trivy:0.76.2 clean \
                --cache-dir /cache/trivy --scan-cache
            fi

            fs_start=$(date +%s.%N)
            if docker run --rm -v trivy-cache:/cache/trivy -v "$PWD:/src" \
              aquasec/trivy:0.76.2 fs \
              --cache-dir /cache/trivy \
              --skip-db-update \
              --scanners vuln \
              --skip-dirs node_modules \
              --exit-code 0 \
              --format json \
              --output "/src/trivy-reports/trivy-fs-report-${repeat_id}.json" \
              /src; then
              fs_scan_exit=0
            else
              fs_scan_exit=$?
            fi

            if [ "$fs_scan_exit" -eq 0 ]; then
              if docker run --rm -v trivy-cache:/cache/trivy -v "$PWD:/src" \
                aquasec/trivy:0.76.2 convert \
                --cache-dir /cache/trivy \
                --scanners vuln --format table --severity HIGH,CRITICAL --exit-code 1 \
                "/src/trivy-reports/trivy-fs-report-${repeat_id}.json"; then
                fs_gate_exit=0
              else
                fs_gate_exit=$?
              fi
            else
              fs_gate_exit=$fs_scan_exit
            fi
            fs_end=$(date +%s.%N)

            image_start=$(date +%s.%N)
            if docker run --rm -v trivy-cache:/cache/trivy \
              -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" \
              aquasec/trivy:0.76.2 image \
              --cache-dir /cache/trivy \
              --skip-db-update \
              --scanners vuln \
              --exit-code 0 \
              --format json \
              --output "/src/trivy-reports/trivy-image-report-${repeat_id}.json" \
              "app-devsecops:${GITHUB_SHA}"; then
              image_scan_exit=0
            else
              image_scan_exit=$?
            fi

            if [ "$image_scan_exit" -eq 0 ]; then
              if docker run --rm -v trivy-cache:/cache/trivy -v "$PWD:/src" \
                aquasec/trivy:0.76.2 convert \
                --cache-dir /cache/trivy \
                --scanners vuln --format table --severity HIGH,CRITICAL --exit-code 1 \
                "/src/trivy-reports/trivy-image-report-${repeat_id}.json"; then
                image_gate_exit=0
              else
                image_gate_exit=$?
              fi
            else
              image_gate_exit=$image_scan_exit
            fi
            image_end=$(date +%s.%N)

            python3 - "$repeat_no" "$fs_start" "$fs_end" "$image_start" \
              "$image_end" "$fs_gate_exit" "$image_gate_exit" "$db_warmed_at" <<'PY'
          import json
          import sys

          repeat_no = int(sys.argv[1])
          fs_start, fs_end, image_start, image_end = map(float, sys.argv[2:6])
          fs_exit, image_exit = map(int, sys.argv[6:8])
          timing = {
              "trivy_fs_execution_time_sec": round(fs_end - fs_start, 3),
              "trivy_image_execution_time_sec": round(image_end - image_start, 3),
              "trivy_pipeline_total_sec": round(image_end - fs_start, 3),
              "trivy_fs_gate_exit_code": fs_exit,
              "trivy_image_gate_exit_code": image_exit,
              "repeat_no": repeat_no,
              "trivy_version": "0.76.2",
              "vulnerability_db_warmed_at_utc": sys.argv[8],
          }
          with open(
              f"trivy-reports/trivy-timing-{repeat_no:02d}.json",
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(timing, file, indent=2)
          PY

            if [ "$fs_gate_exit" -ne 0 ] || [ "$image_gate_exit" -ne 0 ]; then
              overall_failed=1
              echo "Lần ${repeat_no}: Trivy HIGH/CRITICAL gate thất bại."
            else
              echo "Lần ${repeat_no}: Trivy HIGH/CRITICAL gate đạt."
            fi
          done

          if [ "$overall_failed" -ne 0 ]; then
            echo "Trivy HIGH/CRITICAL gate thất bại ở ít nhất một lần quét."
            exit 1
          fi
          echo "Trivy HIGH/CRITICAL gate đạt trong cả ba lần quét."

      - name: Export Metrics CSV
        if: always()
        run: |
          python3 scripts/gen_csv.py \
            --reports-dir trivy-reports \
            --output trivy-reports/results_metrics.csv \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --scenario Patched \
            --commit "${GITHUB_SHA}"

      - name: Upload SCA, SBOM, and Metrics Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sca-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cyclonedx-sbom.json
            cyclonedx-sbom.json.sha256
            trivy-reports/
          if-no-files-found: warn

  # ============================================================================
  # CHẶNG 5: DAST SCANNING (PHẦN QUYẾT - OWASP ZAP)
  # ============================================================================
  dast:
    name: 5. DAST Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build and Run Web Container
        run: |
          docker build -t target-app .
          docker run -d --name test-web -p 3000:3000 target-app
          sleep 5
          curl -I http://localhost:3000 || exit 1

      - name: Run OWASP ZAP Baseline Scan
        run: |
          mkdir -p zap-work
          chmod 777 zap-work

          # Ép ký tự TAB thật bằng printf (chống lỗi space)
          printf "10049\tIGNORE\t(Storable and Cacheable Content)\n10055\tIGNORE\t(CSP: Failure to Define Directive with No Fallback)\n10063\tIGNORE\t(Permissions Policy Header Not Set)\n" > zap-work/zap.conf

          docker run --rm --net="host" -v $(pwd)/zap-work:/zap/wrk/:rw \
            zaproxy/zap-stable zap-baseline.py \
            -t http://localhost:3000 \
            -c zap.conf \
            -J zap-report.json \
            -r zap-report.html

      - name: Upload DAST Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-work/
          if-no-files-found: ignore

  # ============================================================================
  # CHẶNG 6: TỔNG KẾT & CHỐT CHẶN PHÁT HÀNH (DEPLOY GATE)
  # ============================================================================
  deploy:
    name: 6. Quality Gate & Push to Registry
    needs: [unit-test, secret-scan, sast, sca-sbom, dast]
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Gates Passed
        run: |
          echo "======================================================================"
          echo "✅ QUALITY GATE PASSED: Toàn bộ 5 chốt chặn an ninh đều đạt chuẩn!"
          echo "🚀 Cấp quyền mở khóa triển khai (Deploy) sản phẩm lên GHCR!"
          echo "======================================================================"
